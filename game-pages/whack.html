<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Whack-a-Mole</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Whack-a-Mole</div><div class="stats"><div class="stat"><small>SCORE</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><style>.hole{font-size:34px;aspect-ratio:1;padding:0;background:linear-gradient(#92400e,#78350f);box-shadow:0 3px #451a03}</style>
<div id=g class=grid style="grid-template-columns:repeat(3,1fr)"></div><div class=msg id=tm style="color:#7dd3fc">Time: 30</div><div class="row"><button class="btn" id="go">START</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
const g=$('g'),H=[];let m=-1,left=30,pt,tt,on=0;
for(let i=0;i<9;i++){const b=document.createElement('button');b.className='btn hole';b.textContent='🕳️';b.onpointerdown=()=>hit(i);g.appendChild(b);H.push(b)}
function hit(i){if(!on||i!==m)return;H[i].textContent='💥';m=-1;S(score+1)}
function pop(){if(m>=0)H[m].textContent='🕳️';m=Math.random()*9|0;H[m].textContent='🐹'}
function end(){on=0;clearInterval(pt);clearInterval(tt);if(m>=0)H[m].textContent='🕳️';M('Time up! You whacked '+score+' moles');$('go').textContent='PLAY AGAIN'}
function start(){clearInterval(pt);clearInterval(tt);S(0);left=30;on=1;M('');$('tm').textContent='Time: 30';pop();
 pt=setInterval(pop,Math.max(450,750-score*8));tt=setInterval(()=>{left--;$('tm').textContent='Time: '+left;if(left<=0)end()},1000)}
$('go').onclick=start;M('Tap START, then whack the 🐹!');</script></body></html>
