<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD 2048</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">2048</div><div class="stats"><div class="stat"><small>SCORE</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><style>.t{aspect-ratio:1;border-radius:9px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:22px;color:#1e293b;background:#1e3a5f}</style>
<div id=bd class=grid style="grid-template-columns:repeat(4,1fr);touch-action:none"></div>
<div class=row><button class=btn data-d=0>◀</button><button class=btn data-d=2>▲</button><button class=btn data-d=3>▼</button><button class=btn data-d=1>▶</button></div><div class="row"><button class="btn" id="go">NEW GAME</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
let b=Array(16).fill(0),won=0;const bd=$('bd');
function add(){const e=b.map((v,i)=>v?-1:i).filter(i=>i>=0);if(e.length)b[e[Math.random()*e.length|0]]=Math.random()<.9?2:4}
function draw(){bd.innerHTML='';b.forEach(v=>{const d=document.createElement('div');d.className='t';if(v){d.textContent=v;d.style.background='hsl('+(220-Math.log2(v)*22)+',75%,'+(78-Math.log2(v)*2.5)+'%)';if(v>=1024)d.style.fontSize='17px'}bd.appendChild(d)})}
function lines(d){const r=[];for(let i=0;i<4;i++){const l=[];for(let j=0;j<4;j++)l.push(d<2?i*4+j:j*4+i);if(d&1)l.reverse();r.push(l)}return r}
function stuck(){if(b.includes(0))return false;for(let i=0;i<16;i++){if(i%4<3&&b[i]===b[i+1])return false;if(i<12&&b[i]===b[i+4])return false}return true}
function mv(d){let ch=0,g=0;for(const l of lines(d)){const v=l.map(k=>b[k]).filter(Boolean),o=[];
 for(let i=0;i<v.length;i++){if(v[i]===v[i+1]){o.push(v[i]*2);g+=v[i]*2;i++}else o.push(v[i])}
 while(o.length<4)o.push(0);l.forEach((k,i)=>{if(b[k]!==o[i])ch=1;b[k]=o[i]})}
 if(ch){add();S(score+g);draw();if(!won&&b.includes(2048)){won=1;M('🎉 You made 2048! Keep going!')}else if(stuck())M('No moves left! Score '+score)}}
function start(){b=Array(16).fill(0);won=0;add();add();S(0);M('Swipe or use arrows');draw()}
$('go').onclick=start;document.querySelectorAll('[data-d]').forEach(e=>e.onclick=()=>mv(+e.dataset.d));
let px,py;bd.onpointerdown=e=>{px=e.clientX;py=e.clientY};
bd.onpointerup=e=>{const dx=e.clientX-px,dy=e.clientY-py;if(Math.max(Math.abs(dx),Math.abs(dy))<20)return;mv(Math.abs(dx)>Math.abs(dy)?(dx>0?1:0):(dy>0?3:2))};
start();</script></body></html>
