<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Snake</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Snake</div><div class="stats"><div class="stat"><small>SCORE</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><canvas id=c width=300 height=300></canvas>
<div class=row><button class=btn data-d=l>◀</button><button class=btn data-d=u>▲</button><button class=btn data-d=d>▼</button><button class=btn data-d=r>▶</button></div><div class="row"><button class="btn" id="go">START</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
const c=$('c'),x=c.getContext('2d'),N=15,Z=20;let s,d,nd,f,t;
const V={l:[-1,0],r:[1,0],u:[0,-1],d:[0,1]};
function turn(k){const v=V[k];if(v[0]!==-d[0]||v[1]!==-d[1])nd=v}
function food(){do f=[Math.random()*N|0,Math.random()*N|0];while(s.some(p=>p[0]===f[0]&&p[1]===f[1]))}
function draw(){x.fillStyle='#0a1a2c';x.fillRect(0,0,300,300);x.fillStyle='#f43f5e';x.fillRect(f[0]*Z+2,f[1]*Z+2,Z-4,Z-4);s.forEach((p,i)=>{x.fillStyle=i?'#4ade80':'#bbf7d0';x.fillRect(p[0]*Z+1,p[1]*Z+1,Z-2,Z-2)})}
function step(){d=nd;const h=[s[0][0]+d[0],s[0][1]+d[1]];
 if(h[0]<0||h[1]<0||h[0]>=N||h[1]>=N||s.some(p=>p[0]===h[0]&&p[1]===h[1])){clearInterval(t);M('Game over! Score '+score);$('go').textContent='PLAY AGAIN';return}
 s.unshift(h);if(h[0]===f[0]&&h[1]===f[1]){S(score+1);food()}else s.pop();draw()}
function start(){clearInterval(t);s=[[7,7],[6,7],[5,7]];d=nd=V.r;S(0);food();M('');draw();t=setInterval(step,120)}
$('go').onclick=start;
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>turn(b.dataset.d));
let px,py;c.onpointerdown=e=>{px=e.clientX;py=e.clientY};
c.onpointerup=e=>{const dx=e.clientX-px,dy=e.clientY-py;if(Math.max(Math.abs(dx),Math.abs(dy))<15)return;turn(Math.abs(dx)>Math.abs(dy)?(dx>0?'r':'l'):(dy>0?'d':'u'))};
s=[[7,7]];d=nd=V.r;f=[10,7];draw();M('Tap START. Swipe or use arrows.');</script></body></html>
