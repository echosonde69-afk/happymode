<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Simon Says</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Simon Says</div><div class="stats"><div class="stat"><small>ROUND</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><style>.pad{aspect-ratio:1.4;border-radius:16px;opacity:.55;border:0}</style>
<div id=sg class=grid style="grid-template-columns:1fr 1fr"></div><div class="row"><button class="btn" id="go">START</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
const col=['#ef4444','#22c55e','#3b82f6','#eab308'],pads=[];let seq=[],pos=0,lock=1,gen=0;
col.forEach((cl,k)=>{const b=document.createElement('button');b.className='pad';b.style.background=cl;b.onpointerdown=()=>tap(k);$('sg').appendChild(b);pads.push(b)});
function flash(k){pads[k].style.opacity=1;pads[k].style.filter='brightness(1.4)';setTimeout(()=>{pads[k].style.opacity='.55';pads[k].style.filter=''},350)}
function play(){const my=gen;lock=1;pos=0;M('Watch…');seq.forEach((k,i)=>setTimeout(()=>{if(my===gen)flash(k)},600+i*600));setTimeout(()=>{if(my===gen){lock=0;M('Your turn!')}},600+seq.length*600)}
function next(){seq.push(Math.random()*4|0);play()}
function tap(k){if(lock)return;flash(k);if(k!==seq[pos]){lock=1;M('❌ Wrong! You reached round '+score);$('go').textContent='PLAY AGAIN';return}
 pos++;if(pos===seq.length){S(seq.length);lock=1;M('✅ Nice!');const my=gen;setTimeout(()=>{if(my===gen)next()},800)}}
function start(){gen++;seq=[];S(0);next()}
$('go').onclick=start;M('Tap START and copy the pattern');</script></body></html>
