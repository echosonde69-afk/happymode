<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Hangman</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Hangman</div><div class="stats"><div class="stat"><small>STREAK</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><style>.kb{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-top:10px}.kb button{padding:9px 0;font-size:14px}.kb button:disabled{opacity:.3}.wd{text-align:center;font-size:26px;letter-spacing:5px;font-weight:900;margin:8px 0;min-height:36px}.lv{text-align:center;font-size:20px}</style>
<div class=lv id=lv></div><div class=wd id=wd></div><div class=kb id=kb></div><div class="row"><button class="btn" id="go">NEW WORD</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
const W=['PAKISTAN','LAHORE','ISLAMABAD','CRICKET','ELEPHANT','COMPUTER','MOUNTAIN','BUTTERFLY','CHOCOLATE','TELEPHONE','RAINBOW','GUITAR','DOCTOR','PLANET','JUNGLE','FOOTBALL','DIAMOND','KEYBOARD','WHATSAPP','UNIVERSE','LIBRARY','AIRPLANE','KANGAROO','TREASURE'];
let w,gs,lives,wins=0,over=1;
function draw(){$('lv').textContent='❤️'.repeat(lives)+'🖤'.repeat(6-lives);$('wd').textContent=[...w].map(ch=>gs.has(ch)||over&&lives<=0?ch:'_').join(' ');
 [...$('kb').children].forEach(b=>b.disabled=over||gs.has(b.textContent))}
function pick(ch){if(over||gs.has(ch))return;gs.add(ch);if(!w.includes(ch))lives--;
 if([...w].every(k=>gs.has(k))){over=1;wins++;S(wins);M('✅ Correct! Next word →')}
 else if(lives<=0){over=1;wins=0;S(0);M('💀 It was '+w)}draw()}
function start(){w=W[Math.random()*W.length|0];gs=new Set();lives=6;over=0;M('Guess the '+w.length+'-letter word');draw()}
'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').forEach(ch=>{const b=document.createElement('button');b.className='btn';b.textContent=ch;b.onclick=()=>pick(ch);$('kb').appendChild(b)});
$('go').onclick=start;start();</script></body></html>
