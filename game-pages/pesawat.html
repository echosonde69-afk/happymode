<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Space Rush</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:9px;background:#06152c;color:#fff;font-family:system-ui,Arial,sans-serif}.card{max-width:470px;margin:auto;padding:12px;border:2px solid #398de0;border-radius:18px;background:linear-gradient(160deg,#102e58,#081326);box-shadow:0 10px 28px #0009}.head{display:flex;justify-content:space-between;align-items:center;gap:8px}.brand{font-size:10px;letter-spacing:2px;color:#8bdcff;font-weight:900}.title{font-size:21px;font-weight:1000}.stats{display:flex;gap:5px}.stat{min-width:54px;text-align:center;padding:6px 4px;border-radius:9px;background:#173d66;border:1px solid #28679b}.stat small{display:block;font-size:8px;color:#9bdcff}.stat b{font-size:14px}canvas{display:block;width:100%;height:auto;aspect-ratio:4/5;margin-top:10px;border:2px solid #27689e;border-radius:12px;background:#07172c;touch-action:none}.controls{display:flex;gap:8px;margin-top:9px}.controls button{flex:1;padding:13px 4px;border:0;border-radius:10px;font-weight:900;background:linear-gradient(#b8ecff,#3b9bea);color:#062244;box-shadow:0 4px #145184;touch-action:manipulation}.overlay{position:relative;margin-top:-235px;margin-bottom:95px;display:flex;justify-content:center;pointer-events:none}.overlay.off{display:none}.panel{width:86%;padding:12px;border:1px solid #9be4ff;border-radius:13px;background:#0b2b50f2;text-align:center;pointer-events:auto}.panel h2{margin:0;color:#ffe27a}.panel p{font-size:12px;line-height:1.4}.panel button{padding:10px 18px;border:0;border-radius:9px;background:#ffe16b;font-weight:900}.foot{text-align:center;color:#9bbbd5;font-size:9px;letter-spacing:2px;margin-top:9px}
</style></head><body><div class="card"><div class="head"><div><div class="brand">JOKER XD ARCADE</div><div class="title">🚀 SPACE RUSH</div></div><div class="stats"><div class="stat"><small>SCORE</small><b id="score">0</b></div><div class="stat"><small>KILLS</small><b id="kills">0</b></div><div class="stat"><small>LIVES</small><b id="lives">3</b></div></div></div><canvas id="game" width="400" height="500"></canvas><div class="overlay" id="overlay"><div class="panel"><h2 id="pt">MISSION READY</h2><p id="msg">Move your ship, shoot incoming drones and avoid asteroids. Collect stars for bonus points.</p><button id="start">▶ START MISSION</button></div></div><div class="controls"><button id="left">⬅ LEFT</button><button id="fire">✦ FIRE</button><button id="right">RIGHT ➡</button></div><div class="foot">JOKER XD • SPACE ARCADE</div></div>
<script>
(()=>{const c=document.getElementById('game'),g=c.getContext('2d'),$=id=>document.getElementById(id),W=400,H=500;let state='ready',last=0,score=0,kills=0,lives=3,ship={x:200,y:438},shots=[],foes=[],stars=[],sparks=[],spawn=0,fire=0,keys={left:false,right:false,fire:false};
function hud(){$('score').textContent=score;$('kills').textContent=kills;$('lives').textContent=lives}
function reset(){score=0;kills=0;lives=3;ship.x=200;shots=[];foes=[];stars=[];sparks=[];spawn=.5;fire=0;hud()}
function end(){state='over';$('pt').textContent='MISSION OVER';$('msg').textContent=`Final score: ${score} • Drones cleared: ${kills}. Try another mission!`;$('start').textContent='↻ PLAY AGAIN';$('overlay').classList.remove('off')}
function draw(){let bg=g.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#07152d');bg.addColorStop(1,'#173f68');g.fillStyle=bg;g.fillRect(0,0,W,H);for(let i=0;i<55;i++){let xx=(i*73)%W,yy=((i*131+score*2)%H);g.fillStyle=i%4?'#b7eaff':'#fff';g.fillRect(xx,yy,i%5===0?2:1,i%5===0?2:1)}
 for(const s of stars){g.fillStyle='#ffe37a';g.beginPath();g.arc(s.x,s.y,4,0,7);g.fill();g.fillStyle='#fff6bd';g.fillRect(s.x-1,s.y-7,2,14)}
 for(const f of foes){g.fillStyle=f.kind==='rock'?'#9b6a50':'#ef566f';g.beginPath();if(f.kind==='rock'){g.arc(f.x,f.y,f.r,0,7)}else{g.moveTo(f.x,f.y-15);g.lineTo(f.x+17,f.y+12);g.lineTo(f.x-17,f.y+12);g.closePath()}g.fill()}
 g.fillStyle='#a6f0ff';for(const b of shots)g.fillRect(b.x-2,b.y-9,4,12);
 g.save();g.translate(ship.x,ship.y);g.fillStyle='#159de8';g.beginPath();g.moveTo(0,-25);g.lineTo(21,20);g.lineTo(0,12);g.lineTo(-21,20);g.closePath();g.fill();g.fillStyle='#c9f6ff';g.beginPath();g.ellipse(0,-5,6,10,0,0,7);g.fill();g.fillStyle='#ffad42';g.fillRect(-5,19,4,10);g.fillRect(2,19,4,10);g.restore();for(const p of sparks){g.fillStyle=p.color;g.globalAlpha=Math.max(0,p.life);g.fillRect(p.x,p.y,4,4);g.globalAlpha=1}}
function burst(x,y){for(let i=0;i<12;i++)sparks.push({x,y,vx:(Math.random()-.5)*170,vy:(Math.random()-.5)*170,life:.5,color:['#ffda6b','#72ddff','#ff7b90'][i%3]})}
function step(t){if(state!=='run')return;let dt=Math.min((t-last)/1000||0,.035);last=t;let speed=260+Math.min(score,1000)*.05;if(keys.left)ship.x-=300*dt;if(keys.right)ship.x+=300*dt;ship.x=Math.max(24,Math.min(W-24,ship.x));fire-=dt;if(keys.fire&&fire<=0){shots.push({x:ship.x,y:ship.y-22});fire=.22}
 spawn-=dt;if(spawn<=0){let rock=Math.random()<.42;foes.push({x:28+Math.random()*(W-56),y:-25,r:rock?17:14,kind:rock?'rock':'drone',hp:1,speed:125+Math.random()*100});spawn=Math.max(.35,.85-score/5000+Math.random()*.45)}
 if(Math.random()<dt*.6)stars.push({x:25+Math.random()*(W-50),y:-10});shots.forEach(b=>b.y-=520*dt);foes.forEach(f=>f.y+=f.speed*dt);stars.forEach(s=>s.y+=150*dt);
 for(const b of shots)for(const f of foes){if(!f.dead&&Math.abs(b.x-f.x)<f.r+4&&Math.abs(b.y-f.y)<f.r+8){f.dead=true;b.dead=true;kills++;score+=15;burst(f.x,f.y)}}
 for(const f of foes){if(!f.dead&&Math.abs(f.x-ship.x)<f.r+17&&Math.abs(f.y-ship.y)<f.r+18){f.dead=true;lives--;burst(f.x,f.y);if(lives<=0){hud();end();return}}}
 for(const s of stars){if(!s.got&&Math.abs(s.x-ship.x)<22&&Math.abs(s.y-ship.y)<25){s.got=true;score+=10}}
 shots=shots.filter(b=>b.y>-15&&!b.dead);foes=foes.filter(f=>f.y<H+30&&!f.dead);stars=stars.filter(s=>s.y<H+15&&!s.got);sparks.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt});sparks=sparks.filter(p=>p.life>0);score+=Math.floor(dt*2);draw();hud();if(state==='run')requestAnimationFrame(step)}
$('start').onclick=()=>{reset();state='run';$('overlay').classList.add('off');last=performance.now();requestAnimationFrame(step)};
function hold(btn,key){const el=$(btn);el.addEventListener('pointerdown',e=>{e.preventDefault();keys[key]=true;el.setPointerCapture?.(e.pointerId)});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,()=>keys[key]=false))}
hold('left','left');hold('right','right');hold('fire','fire');window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=true;if(e.key==='ArrowRight'||e.key==='d')keys.right=true;if(e.code==='Space')keys.fire=true});window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft'||e.key==='a')keys.left=false;if(e.key==='ArrowRight'||e.key==='d')keys.right=false;if(e.code==='Space')keys.fire=false});draw();hud();
})();
</script></body></html>
