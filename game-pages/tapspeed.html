<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Tap Speed</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Tap Speed</div><div class="stats"><div class="stat"><small>TAPS</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><style>.big{width:100%;height:190px;font-size:34px;border-radius:18px}</style>
<button class="btn big" id=tp disabled>GET READY</button><div class=msg id=tm style="color:#7dd3fc">10.0s</div><div class="row"><button class="btn" id="go">START</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
let n=0,on=0,iv,t0;const tp=$('tp');
tp.onpointerdown=()=>{if(!on)return;n++;S(n)};
function end(){on=0;clearInterval(iv);tp.disabled=true;tp.textContent='TIME!';$('tm').textContent='0.0s';M(n+' taps — '+(n/10).toFixed(1)+' taps/sec');$('go').textContent='PLAY AGAIN'}
function start(){clearInterval(iv);on=0;n=0;S(0);M('');let c=3;tp.disabled=true;tp.textContent=c;
 iv=setInterval(()=>{c--;if(c>0){tp.textContent=c;return}clearInterval(iv);tp.disabled=false;tp.textContent='TAP!';on=1;t0=performance.now();
  iv=setInterval(()=>{const l=10-(performance.now()-t0)/1000;if(l<=0)end();else $('tm').textContent=l.toFixed(1)+'s'},50)},800)}
$('go').onclick=start;M('Tap START, then tap as fast as you can!');</script></body></html>
