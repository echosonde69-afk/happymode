<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b12">
<title>Joker-XD — Pair Device</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0b0b12;
  --card:#13131c;
  --border:rgba(255,255,255,.08);
  --text:#f2f2f7;
  --muted:#8b8b9e;
  --accent:#a78bfa;
  --accent2:#7c3aed;
  --ok:#34d399;
  --err:#f87171;
  --busy:#fbbf24;
}
html,body{height:100%}
body{
  min-height:100vh;min-height:100dvh;
  font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;
  color:var(--text);
  background:var(--bg);
  display:flex;align-items:center;justify-content:center;
  padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));
}

.card{
  width:min(400px,100%);
  background:var(--card);
  border:1px solid var(--border);
  border-radius:20px;
  padding:28px 22px 22px;
  box-shadow:0 20px 50px rgba(0,0,0,.45);
}

.top{
  display:flex;align-items:center;gap:12px;
  margin-bottom:6px;
}
.logo-icon{
  width:42px;height:42px;border-radius:12px;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  display:grid;place-items:center;font-size:22px;
  flex-shrink:0;
}
.logo-text{
  font-size:20px;font-weight:700;letter-spacing:.3px;
}
.sub{
  color:var(--muted);font-size:13px;margin-bottom:22px;margin-left:54px;
}

label{
  display:block;font-size:12px;font-weight:600;
  color:var(--muted);margin-bottom:8px;letter-spacing:.3px;
  text-transform:uppercase;
}
.field{
  display:flex;align-items:center;gap:10px;
  background:rgba(255,255,255,.04);
  border:1px solid var(--border);
  border-radius:12px;
  padding:0 14px;
  margin-bottom:14px;
  transition:border-color .15s;
}
.field:focus-within{border-color:var(--accent)}
.field .ico{font-size:18px;opacity:.7}
.field input{
  flex:1;background:transparent;border:0;outline:0;
  color:var(--text);font-size:16px;padding:14px 0;
  font-family:inherit;letter-spacing:.5px;
}
.field input::placeholder{color:#55556a}

.btn{
  width:100%;border:0;outline:0;cursor:pointer;
  background:linear-gradient(135deg,var(--accent2),var(--accent));
  color:#fff;font-size:15px;font-weight:600;
  padding:14px 18px;border-radius:12px;
  font-family:inherit;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:opacity .15s,transform .1s;
}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn .spin{
  display:none;width:16px;height:16px;
  border:2px solid rgba(255,255,255,.3);
  border-top-color:#fff;border-radius:50%;
  animation:spin .6s linear infinite;
}
.btn.loading .spin{display:block}
.btn.loading #btnText{opacity:.85}
@keyframes spin{to{transform:rotate(360deg)}}

.code-area{
  display:none;margin-top:18px;text-align:center;
}
.code-area.show{display:block}
.code-box{
  display:flex;justify-content:center;gap:6px;flex-wrap:wrap;
  margin-bottom:12px;
}
.code-box span{
  display:inline-flex;align-items:center;justify-content:center;
  min-width:36px;height:44px;padding:0 6px;
  background:rgba(167,139,250,.12);
  border:1px solid rgba(167,139,250,.25);
  border-radius:10px;
  font-size:22px;font-weight:700;letter-spacing:1px;
  color:var(--accent);
  font-variant-numeric:tabular-nums;
}
.timer{
  height:3px;background:rgba(255,255,255,.08);
  border-radius:99px;overflow:hidden;margin-bottom:8px;
}
.timer i{
  display:block;height:100%;width:100%;
  background:var(--accent);
  transform-origin:left center;
  transition:transform .25s linear;
}
.timer-label{
  font-size:12px;color:var(--muted);
}

.copy-btn{
  display:none;width:100%;margin-top:12px;
  border:1px solid var(--border);background:rgba(255,255,255,.04);
  color:var(--text);font-size:14px;font-weight:500;
  padding:12px;border-radius:12px;cursor:pointer;
  font-family:inherit;transition:background .15s;
}
.copy-btn.show{display:block}
.copy-btn:active{background:rgba(255,255,255,.08)}

#status{
  margin-top:14px;font-size:13px;text-align:center;
  min-height:20px;line-height:1.4;
}
#status.ok{color:var(--ok)}
#status.err{color:var(--err)}
#status.busy{color:var(--busy)}

.steps{
  margin-top:22px;padding-top:18px;
  border-top:1px solid var(--border);
}
.step{
  display:flex;align-items:flex-start;gap:10px;
  font-size:13px;color:var(--muted);margin-bottom:10px;
  line-height:1.4;
}
.step:last-child{margin-bottom:0}
.step em{
  flex:none;width:22px;height:22px;border-radius:50%;
  background:rgba(167,139,250,.15);color:var(--accent);
  display:grid;place-items:center;
  font-style:normal;font-size:11px;font-weight:700;
}
.step strong{color:var(--text);font-weight:600}

.ver{
  margin-top:18px;text-align:center;
  font-size:11px;color:#55556a;letter-spacing:.3px;
}
</style>
</head>
<body>
<main class="card">
  <div class="top">
    <div class="logo-icon">🃏</div>
    <div class="logo-text">Joker-XD</div>
  </div>
  <p class="sub">Multi-Device Pairing</p>

  <label for="number">WhatsApp Number</label>
  <div class="field">
    <span class="ico">📱</span>
    <input id="number" placeholder="92XXXXXXXXXX" inputmode="numeric" autocomplete="tel" maxlength="16">
  </div>

  <button class="btn" id="pairBtn" type="button">
    <span class="spin"></span>
    <span id="btnText">Get Pairing Code</span>
  </button>

  <div class="code-area" id="codeArea">
    <div class="code-box" id="code"></div>
    <div class="timer"><i id="timerBar"></i></div>
    <div class="timer-label" id="timerLabel"></div>
  </div>
  <button id="copyBtn" class="copy-btn" type="button">📋 Copy Pairing Code</button>
  <p id="status"></p>

  <div class="steps">
    <div class="step"><em>1</em><span>Open WhatsApp → <strong>Linked devices</strong></span></div>
    <div class="step"><em>2</em><span>Tap <strong>Link a device</strong> → <strong>Link with phone number</strong></span></div>
    <div class="step"><em>3</em><span>Enter the code shown above</span></div>
  </div>
  <div class="ver">Joker-XD · Fast Pairing</div>
</main>

<script>
var $ = function(id){ return document.getElementById(id); };
var currentCode = "";
var timerId = null;

function setStatus(msg, type){
  var s = $("status");
  s.textContent = msg || "";
  s.className = type || "";
}

function renderCode(code){
  var box = $("code");
  box.innerHTML = "";
  String(code).split("").forEach(function(ch){
    var span = document.createElement("span");
    span.textContent = ch;
    box.appendChild(span);
  });
}

function startTimer(seconds){
  clearInterval(timerId);
  var bar = $("timerBar");
  var label = $("timerLabel");
  var left = seconds;
  function tick(){
    left -= 0.25;
    if(left < 0) left = 0;
    bar.style.transform = "scaleX(" + (left / seconds) + ")";
    if(left > 0){
      label.textContent = "Enter this code in WhatsApp · " + Math.ceil(left) + "s";
    } else {
      label.textContent = "Code may have expired — generate a new one if linking fails";
      clearInterval(timerId);
    }
  }
  tick();
  timerId = setInterval(tick, 250);
}

async function pair(){
  var n = $("number").value.trim().replace(/\D/g, "");
  var btn = $("pairBtn");
  clearInterval(timerId);
  currentCode = "";
  $("code").innerHTML = "";
  $("codeArea").classList.remove("show");
  $("copyBtn").classList.remove("show");

  if(!n || n.length < 10){
    setStatus("⚠️ Enter a valid number with country code", "err");
    return;
  }

  setStatus("⏳ Generating pairing code...", "busy");
  btn.disabled = true;
  btn.classList.add("loading");
  $("btnText").textContent = "Generating...";

  try{
    var r = await fetch("/pair?number=" + encodeURIComponent(n));
    var data = await r.json();
    if(!r.ok) throw new Error(data.error || "Request failed");
    currentCode = data.code || "";
    if(currentCode){
      renderCode(currentCode);
      $("codeArea").classList.add("show");
      $("copyBtn").classList.add("show");
      startTimer(60);
    }
    setStatus(data.message || "✅ Use this code in WhatsApp within 60s", "ok");
  } catch(e){
    setStatus("❌ " + (e.message || "Failed"), "err");
  } finally {
    btn.disabled = false;
    btn.classList.remove("loading");
    $("btnText").textContent = "Get Pairing Code";
  }
}

async function copyCode(){
  if(!currentCode) return;
  var text = String(currentCode);
  try{
    await navigator.clipboard.writeText(text);
  } catch(e){
    var area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.opacity = "0";
    document.body.appendChild(area);
    area.select();
    try{ document.execCommand("copy"); } catch(_){}
    area.remove();
  }
  setStatus("✅ Pairing code copied!", "ok");
}

$("pairBtn").addEventListener("click", pair);
$("copyBtn").addEventListener("click", copyCode);
$("number").addEventListener("input", function(){
  this.value = this.value.replace(/\D/g, "");
});
$("number").addEventListener("keydown", function(e){
  if(e.key === "Enter") pair();
});
</script>
</body>
</html>
