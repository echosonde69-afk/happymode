<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Fruit Match</title>
<style>
*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:radial-gradient(circle at top,#185b49,#061e1a 75%);color:#f5ffe9;font-family:system-ui,Arial,sans-serif}.card{max-width:440px;margin:auto;padding:13px;border:2px solid #65c58c;border-radius:18px;background:linear-gradient(150deg,#164a39,#08251e);box-shadow:0 12px 30px #0009}.brand{text-align:center;color:#9af2b9;font-size:10px;font-weight:900;letter-spacing:2px}.title{text-align:center;font-size:23px;font-weight:1000;margin:2px 0 10px}.stats{display:flex;gap:7px;margin-bottom:10px}.stat{flex:1;text-align:center;padding:7px;border:1px solid #477d60;border-radius:9px;background:#0b3025}.stat small{display:block;font-size:9px;color:#9edbb0;letter-spacing:1px}.stat b{font-size:17px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tile{aspect-ratio:1;border:2px solid #75bd8c;border-radius:12px;background:linear-gradient(145deg,#2b7653,#123b2d);box-shadow:0 4px #061c15;display:flex;align-items:center;justify-content:center;font-size:clamp(25px,8vw,39px);cursor:pointer;touch-action:manipulation}.tile.open,.tile.matched{background:linear-gradient(145deg,#f1ffe2,#b9e7b2);border-color:#d5ffd1;box-shadow:0 3px #64996c}.tile.matched{opacity:.72}.tile:active{transform:scale(.96)}.actions{display:flex;gap:8px;margin-top:11px}.actions button{flex:1;padding:12px 5px;border:0;border-radius:10px;background:linear-gradient(#d7ffb5,#8bdc78);color:#143321;font-weight:900}.message{text-align:center;min-height:20px;margin:10px 0 0;font-size:12px;color:#c6f6d0}.foot{text-align:center;margin-top:10px;font-size:9px;color:#9dc8a9;letter-spacing:2px}
</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">🍉 FRUIT MATCH</div><div class="stats"><div class="stat"><small>MATCHES</small><b id="matches">0/8</b></div><div class="stat"><small>MOVES</small><b id="moves">0</b></div><div class="stat"><small>TIME</small><b id="time">0s</b></div></div><div class="grid" id="grid"></div><div class="message" id="message">Find all 8 matching fruit pairs!</div><div class="actions"><button id="restart">↻ NEW GAME</button><button id="hint">💡 HINT</button></div><div class="foot">NO BETS • NO PURCHASES • JUST A MEMORY GAME</div></div>
<script>
(()=>{const fruits=['🍎','🍌','🍇','🍒','🍋','🍉','🍍','🥝'];const $=id=>document.getElementById(id);let deck=[],first=null,lock=false,moves=0,matched=0,seconds=0,timer=null,started=false;
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hud(){$('matches').textContent=matched+'/8';$('moves').textContent=moves;$('time').textContent=seconds+'s'}
function start(){clearInterval(timer);deck=shuffle([...fruits,...fruits].map((fruit,id)=>({id,fruit,open:false,matched:false})));first=null;lock=false;moves=0;matched=0;seconds=0;started=false;hud();$('message').textContent='Find all 8 matching fruit pairs!';render()}
function render(){$('grid').innerHTML='';deck.forEach((card,i)=>{const b=document.createElement('button');b.className='tile'+(card.open?' open':'')+(card.matched?' matched':'');b.type='button';b.textContent=card.open||card.matched?card.fruit:'?';b.setAttribute('aria-label',card.open||card.matched?card.fruit:'Hidden fruit');b.addEventListener('click',()=>flip(i));$('grid').appendChild(b)})}
function flip(i){if(lock)return;const c=deck[i];if(c.open||c.matched)return;if(!started){started=true;timer=setInterval(()=>{seconds++;hud()},1000)}c.open=true;render();if(!first){first=i;return}moves++;const a=deck[first];if(a.fruit===c.fruit){a.matched=true;c.matched=true;matched++;first=null;$('message').textContent='Great match! ✨';if(matched===8){clearInterval(timer);$('message').textContent=`You matched every pair in ${moves} moves and ${seconds} seconds. Well played!`} }else{lock=true;$('message').textContent='Not a match — try again!';setTimeout(()=>{a.open=false;c.open=false;first=null;lock=false;render()},750)}hud()}
$('restart').onclick=start;$('hint').onclick=()=>{if(lock||matched===8)return;const pair=deck.filter(c=>!c.matched);const firstFruit=pair[0]?.fruit;const pairCards=pair.filter(c=>c.fruit===firstFruit);$('message').textContent=pairCards.length===2?'Hint: look for a matching pair of '+firstFruit:'Keep looking for a pair!'};start();
})();
</script></body></html>
