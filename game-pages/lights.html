<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Lights Out</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Lights Out</div><div class="stats"><div class="stat"><small>MOVES</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">-</b></div></div><style>.lt{aspect-ratio:1;padding:0;border-radius:10px;font-size:20px}.on{background:linear-gradient(#fde047,#facc15);box-shadow:0 0 12px #facc15}.off{background:#1e3a5f;box-shadow:none}</style>
<div id=g class=grid style="grid-template-columns:repeat(5,1fr);max-width:300px"></div><div class="row"><button class="btn" id="go">NEW PUZZLE</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
let b=Array(25).fill(0),mv=0,bb=0,done=0;const g=$('g');
function tg(i){const y=i/5|0,x=i%5;b[i]^=1;if(y>0)b[i-5]^=1;if(y<4)b[i+5]^=1;if(x>0)b[i-1]^=1;if(x<4)b[i+1]^=1}
function draw(){g.innerHTML='';b.forEach((v,i)=>{const e=document.createElement('button');e.className='btn lt '+(v?'on':'off');e.onclick=()=>tap(i);g.appendChild(e)})}
function tap(i){if(done)return;tg(i);mv++;$('sc').textContent=mv;draw();if(b.every(v=>!v)){done=1;if(!bb||mv<bb){bb=mv;$('bs').textContent=bb}M('🏆 All lights off in '+mv+' moves!')}}
function start(){b=Array(25).fill(0);for(let k=0;k<14;k++)tg(Math.random()*25|0);if(b.every(v=>!v))return start();mv=0;done=0;$('sc').textContent=0;M('Tap a light — it flips its neighbours too');draw()}
$('go').onclick=start;start();</script></body></html>
