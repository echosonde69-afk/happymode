<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Pong vs Bot</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Pong vs Bot</div><div class="stats"><div class="stat"><small>SCORE</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><canvas id=c width=300 height=400></canvas><div class="row"><button class="btn" id="go">START</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
const c=$('c'),x=c.getContext('2d');let px=122,ax=122,bx=150,by=200,vx=2,vy=3,run=0;
function serve(dir){bx=150;by=200;vx=(Math.random()<.5?-1:1)*2;vy=3*dir}
function draw(){x.fillStyle='#0a1a2c';x.fillRect(0,0,300,400);x.fillStyle='#1e3a5f';for(let i=0;i<300;i+=20)x.fillRect(i,198,10,3);
 x.fillStyle='#f87171';x.fillRect(ax,12,56,8);x.fillStyle='#7dd3fc';x.fillRect(px,380,56,8);x.fillStyle='#fff';x.beginPath();x.arc(bx,by,6,0,7);x.fill()}
function end(){run=0;M('Game over! Score '+score);$('go').textContent='PLAY AGAIN'}
function loop(){if(!run)return;bx+=vx;by+=vy;if(bx<6||bx>294)vx=-vx;
 const sp=Math.min(4.4,2.2+score*.04);if(vy<0){const t=bx-28;ax+=Math.max(-sp,Math.min(sp,t-ax))}
 if(vy>0&&by+6>=380&&by<390&&bx>px-4&&bx<px+60){vy=-Math.min(7,Math.abs(vy)+.25);vx=(bx-(px+28))/28*4;S(score+1)}
 if(vy<0&&by-6<=20&&by>10&&bx>ax-4&&bx<ax+60){vy=Math.min(7,Math.abs(vy)+.1);vx=(bx-(ax+28))/28*4}
 if(by<-10){S(score+5);serve(1)}
 if(by>410){draw();return end('Game over! Score '+score)}
 draw();requestAnimationFrame(loop)}
function mp(e){const r=c.getBoundingClientRect();px=Math.max(0,Math.min(244,(e.clientX-r.left)/r.width*300-28))}
function start(){S(0);M('');px=ax=122;serve(1);run=1;loop()}
c.onpointermove=mp;c.onpointerdown=mp;$('go').onclick=start;draw();M('Drag to move your paddle (bottom)');</script></body></html>
