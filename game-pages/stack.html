<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Stack Tower</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Stack Tower</div><div class="stats"><div class="stat"><small>FLOORS</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><canvas id=c width=300 height=400></canvas><div class="row"><button class="btn" id="go">START</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
const c=$('c'),x=c.getContext('2d'),BH=20;let st=[],cur,run=0;
function draw(){x.fillStyle='#0c1a30';x.fillRect(0,0,300,400);const off=Math.max(0,st.length-12)*BH;
 const all=cur?[...st,cur]:st;all.forEach((b,i)=>{x.fillStyle='hsl('+(i*22%360)+',70%,58%)';x.fillRect(b.x,380-(i+1)*BH+off,b.w,BH-1)})}
function end(){run=0;M('Tower fell! Floors: '+score);$('go').textContent='PLAY AGAIN'}
function loop(){if(!run)return;cur.x+=cur.d*Math.min(6,2+score*.12);if(cur.x<=0){cur.x=0;cur.d=1}if(cur.x+cur.w>=300){cur.x=300-cur.w;cur.d=-1}draw();requestAnimationFrame(loop)}
function drop(){if(!run)return;const p=st[st.length-1];const l=Math.max(cur.x,p.x),r=Math.min(cur.x+cur.w,p.x+p.w),w=r-l;
 if(w<=0){cur=null;draw();return end()}
 let nb;if(Math.abs(cur.x-p.x)<4){nb={x:p.x,w:p.w};M('✨ Perfect!')}else{nb={x:l,w:w};M('')}
 st.push(nb);S(st.length-1);cur={x:Math.random()<.5?0:300-nb.w,w:nb.w,d:Math.random()<.5?1:-1}}
function start(){st=[{x:100,w:100}];S(0);M('');cur={x:0,w:100,d:1};run=1;loop()}
c.onpointerdown=drop;$('go').onclick=start;st=[{x:100,w:100}];draw();M('Tap the screen to drop the block');</script></body></html>
