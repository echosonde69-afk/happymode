<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Brick Breaker</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Brick Breaker</div><div class="stats"><div class="stat"><small>SCORE</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><canvas id=c width=300 height=360></canvas><div class="row"><button class="btn" id="go">START</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
const c=$('c'),x=c.getContext('2d');let px=120,bx,by,vx,vy,B=[],lives=3,run=0;
function serve(){bx=150;by=300;vx=(Math.random()<.5?-1:1)*2.2;vy=-3.4}
function build(){B=[];for(let r=0;r<5;r++)for(let k=0;k<8;k++)B.push({x:k*36+6,y:r*18+30,a:1,h:r*40})}
function draw(){x.fillStyle='#0a1a2c';x.fillRect(0,0,300,360);B.forEach(b=>{if(b.a){x.fillStyle='hsl('+(b.h+10)+',80%,60%)';x.fillRect(b.x,b.y,32,14)}});
 x.fillStyle='#7dd3fc';x.fillRect(px,340,60,8);x.fillStyle='#fff';x.beginPath();x.arc(bx,by,5,0,7);x.fill();x.fillStyle='#fda4af';x.font='13px sans-serif';x.textAlign='left';x.fillText('❤'.repeat(lives),6,16)}
function end(t){run=0;M(t);$('go').textContent='PLAY AGAIN'}
function loop(){if(!run)return;bx+=vx;by+=vy;if(bx<5||bx>295)vx=-vx;if(by<5)vy=-vy;
 if(vy>0&&by+5>=340&&by<350&&bx>px-3&&bx<px+63){vy=-Math.abs(vy);vx=(bx-(px+30))/30*3.8}
 let hit=0;B.forEach(b=>{if(!hit&&b.a&&bx>b.x-3&&bx<b.x+35&&by>b.y-3&&by<b.y+17){b.a=0;vy=-vy;hit=1;S(score+10)}});
 if(by>370){lives--;if(lives<=0){draw();return end('Game over! Score '+score)}serve()}
 if(B.every(b=>!b.a)){draw();return end('🏆 You cleared all bricks!')}
 draw();requestAnimationFrame(loop)}
function start(){build();lives=3;S(0);M('');serve();run=1;loop()}
function mp(e){const r=c.getBoundingClientRect();px=Math.max(0,Math.min(240,(e.clientX-r.left)/r.width*300-30))}
c.onpointermove=mp;c.onpointerdown=mp;$('go').onclick=start;build();draw();M('Drag on the screen to move the paddle');</script></body></html>
