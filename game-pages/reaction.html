<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Reaction Test</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Reaction Test</div><div class="stats"><div class="stat"><small>LAST (ms)</small><b id="sc">-</b></div><div class="stat"><small>BEST (ms)</small><b id="bs">-</b></div></div><style>.rb{height:210px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:900;background:#334155;text-align:center;padding:10px}</style>
<div id=box class=rb>Tap START</div><div class="row"><button class="btn" id="go">START</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
let st=0,to,t0,bb=0;const b=$('box');
function arm(){b.style.background='#b91c1c';b.textContent='Wait for GREEN…';st=1;M('');
 to=setTimeout(()=>{b.style.background='#16a34a';b.textContent='TAP NOW!';t0=performance.now();st=2},1000+Math.random()*3000)}
b.onpointerdown=()=>{if(st===1){clearTimeout(to);st=0;b.style.background='#334155';b.textContent='Too soon! 😅';M('Too early — press START to retry')}
 else if(st===2){const ms=Math.round(performance.now()-t0);st=0;b.style.background='#334155';b.textContent=ms+' ms';$('sc').textContent=ms;
  if(!bb||ms<bb){bb=ms;$('bs').textContent=ms}M(ms<250?'⚡ Lightning fast!':ms<350?'👍 Good reflexes':'🐢 Try to be faster');$('go').textContent='AGAIN'}};
$('go').onclick=()=>{clearTimeout(to);arm()};</script></body></html>
