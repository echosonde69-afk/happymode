<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Flappy Bird</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Flappy Bird</div><div class="stats"><div class="stat"><small>SCORE</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><canvas id=c width=300 height=400></canvas><div class="row"><button class="btn" id="go">START</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
const c=$('c'),x=c.getContext('2d');let y=200,v=0,P=[],fr=0,run=0;
function flap(){if(run)v=-6}
function draw(){x.fillStyle='#7dd3fc';x.fillRect(0,0,300,400);x.fillStyle='#4ade80';
 P.forEach(p=>{x.fillRect(p.x,0,44,p.g-55);x.fillRect(p.x,p.g+55,44,400-p.g-55)});
 x.fillStyle='#a16207';x.fillRect(0,392,300,8);x.font='26px serif';x.textAlign='center';x.textBaseline='middle';x.fillText('🐤',60,y)}
function end(){run=0;M('Game over! Score '+score);$('go').textContent='PLAY AGAIN'}
function loop(){if(!run)return;fr++;v+=.36;y+=v;if(fr%85===1)P.push({x:300,g:80+Math.random()*240,s:0});
 P.forEach(p=>p.x-=2.2);P=P.filter(p=>p.x>-50);
 let dead=y>380||y<8;
 P.forEach(p=>{if(60+12>p.x&&60-12<p.x+44&&(y-12<p.g-55||y+12>p.g+55))dead=true;if(!p.s&&p.x+44<60){p.s=1;S(score+1)}});
 draw();if(dead)end();else requestAnimationFrame(loop)}
function start(){y=200;v=0;P=[];fr=0;S(0);M('');run=1;loop()}
$('go').onclick=start;c.onpointerdown=flap;draw();M('Tap the screen to flap!');</script></body></html>
