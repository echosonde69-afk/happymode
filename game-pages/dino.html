<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Dino Run</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Dino Run</div><div class="stats"><div class="stat"><small>SCORE</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><canvas id=c width=320 height=160 style="max-width:100%"></canvas><div class="row"><button class="btn" id="go">START</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
const c=$('c'),x=c.getContext('2d'),G0=135;let y=G0,v=0,O=[],fr=0,nx=60,run=0;
function jump(){if(run&&y>=G0)v=-10.5}
function draw(){x.fillStyle='#e0f2fe';x.fillRect(0,0,320,160);x.fillStyle='#78716c';x.fillRect(0,G0+1,320,2);x.font='32px serif';x.textBaseline='alphabetic';x.textAlign='left';
 x.fillText('🦖',22,y);O.forEach(o=>x.fillText('🌵',o.x-6,G0))}
function end(){run=0;M('Game over! Score '+score);$('go').textContent='PLAY AGAIN'}
function loop(){if(!run)return;fr++;const sp=3.2+fr/900;v+=.65;y=Math.min(G0,y+v);if(y>=G0){y=G0;v=0}
 O.forEach(o=>o.x-=sp);O=O.filter(o=>o.x>-30);
 if(fr>=nx){O.push({x:340});nx=fr+Math.floor((55+Math.random()*55)*(3.2/sp)+30)}
 S(Math.floor(fr/6));let dead=false;
 O.forEach(o=>{if(46>o.x&&26<o.x+14&&y>G0-24)dead=true});
 draw();if(dead)end();else requestAnimationFrame(loop)}
function start(){y=G0;v=0;O=[];fr=0;nx=60;S(0);M('');run=1;loop()}
$('go').onclick=start;c.onpointerdown=jump;draw();M('Tap the screen to jump!');</script></body></html>
