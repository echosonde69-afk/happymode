<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>JOKER XD Minesweeper</title><style>*{box-sizing:border-box;user-select:none;-webkit-tap-highlight-color:transparent}body{margin:0;padding:10px;background:#0b1220;color:#eef;font-family:system-ui,Arial,sans-serif}.card{max-width:420px;margin:auto;padding:12px;border:2px solid #38bdf8;border-radius:18px;background:linear-gradient(160deg,#12294a,#08111f);box-shadow:0 10px 30px #0009}.brand{text-align:center;font-size:10px;letter-spacing:2px;color:#7dd3fc;font-weight:900}.title{text-align:center;font-size:21px;font-weight:900;margin:2px 0 8px}.stats{display:flex;gap:6px;margin-bottom:8px}.stat{flex:1;text-align:center;padding:6px;border-radius:9px;background:#173d66;border:1px solid #2b6895}.stat small{display:block;font-size:8px;color:#9bdcff;letter-spacing:1px}.stat b{font-size:16px}canvas{display:block;width:100%;max-width:340px;margin:auto;border:2px solid #2c6a96;border-radius:12px;touch-action:none}.btn{border:0;border-radius:11px;padding:11px 8px;font-weight:900;font-size:16px;color:#06202f;background:linear-gradient(#7dd3fc,#38bdf8);box-shadow:0 3px #1d6b94;cursor:pointer;touch-action:manipulation}.btn:active{transform:translateY(2px);box-shadow:0 1px #1d6b94}.btn:disabled{opacity:.6}.row{display:flex;gap:7px;margin-top:9px}.row .btn{flex:1}.msg{min-height:20px;text-align:center;margin-top:8px;font-weight:800;color:#fde68a;font-size:14px}.grid{display:grid;gap:6px;margin:auto}</style></head><body><div class="card"><div class="brand">JOKER XD ARCADE</div><div class="title">Minesweeper</div><div class="stats"><div class="stat"><small>OPENED</small><b id="sc">0</b></div><div class="stat"><small>BEST</small><b id="bs">0</b></div></div><style>.mg{display:grid;grid-template-columns:repeat(8,1fr);gap:3px;max-width:340px;margin:auto}.cl{aspect-ratio:1;border:0;border-radius:6px;background:#2b5f8f;color:#fff;font-weight:900;font-size:15px;padding:0}.cl.o{background:#cbd5e1;color:#0f172a}.cl.x{background:#ef4444}</style>
<div id=g class=mg></div><div class=row><button class=btn id=md>MODE: ⛏ DIG</button></div><div class="row"><button class="btn" id="go">NEW GAME</button></div><div class="msg" id="msg"></div></div><script>const $=i=>document.getElementById(i);let best=0,score=0;function S(n){score=n;$('sc').textContent=n;if(n>best){best=n;$('bs').textContent=n}}function M(t){$('msg').textContent=t}
const R=8,MN=10,g=$('g'),E=[];let mines,rev,fl,first,over,mode=0;
const nb=i=>{const r=[],y=i/R|0,xx=i%R;for(let a=-1;a<=1;a++)for(let b=-1;b<=1;b++){if(!a&&!b)continue;const ny=y+a,nx=xx+b;if(ny>=0&&ny<R&&nx>=0&&nx<R)r.push(ny*R+nx)}return r};
const COL=['','#1d4ed8','#15803d','#b91c1c','#6d28d9','#9a3412','#0e7490','#000','#444'];
for(let i=0;i<R*R;i++){const b=document.createElement('button');b.className='cl';b.onclick=()=>tap(i);g.appendChild(b);E.push(b)}
function start(){mines=new Set();rev=new Set();fl=new Set();first=1;over=0;S(0);M('Dig safe cells. Use MODE to flag.');E.forEach(b=>{b.className='cl';b.textContent=''})}
function count(i){return nb(i).filter(k=>mines.has(k)).length}
function show(i){const b=E[i];b.className='cl o';const n=count(i);b.textContent=n||'';b.style.color=COL[n]}
function reveal(i){const st=[i];while(st.length){const k=st.pop();if(rev.has(k)||fl.has(k))continue;rev.add(k);show(k);if(!count(k))nb(k).forEach(z=>st.push(z))}}
function tap(i){if(over)return;if(mode){if(rev.has(i))return;if(fl.has(i)){fl.delete(i);E[i].textContent=''}else{fl.add(i);E[i].textContent='🚩'}return}
 if(fl.has(i)||rev.has(i))return;
 if(first){first=0;const safe=new Set([i,...nb(i)]);while(mines.size<MN){const k=Math.random()*R*R|0;if(!safe.has(k))mines.add(k)}}
 if(mines.has(i)){over=1;mines.forEach(k=>{E[k].textContent='💣';E[k].className='cl x'});M('💥 Boom! Game over');return}
 reveal(i);S(rev.size);if(rev.size===R*R-MN){over=1;M('🏆 You cleared the field!')}}
$('md').onclick=()=>{mode=1-mode;$('md').textContent=mode?'MODE: 🚩 FLAG':'MODE: ⛏ DIG'};
$('go').onclick=start;start();</script></body></html>
